name: Scrape

# No `schedule:` here on purpose. The run times live in the dashboard's
# scrape_jobs table, and Supabase dispatches this workflow when one is due — see
# cooscrap-admin/supabase/scrape-schedule.sql. A cron line here as well would
# run every job twice.
on:
  workflow_dispatch: # the scheduler, the dashboard's Run now, or the Actions tab
    inputs:
      op:
        description: Operation to run
        type: choice
        default: scrape-models
        options:
          - scrape-models
      # The dashboard's guest mode (scrape_jobs.guest): run logged out.
      guest:
        description: Run as a guest (not logged in)
        type: boolean
        default: false

# Only one scrape at a time. Runs are started by the schedule and by hand from
# the dashboard, and two browsers driving the site with the same primary
# account at once is asking for trouble — a second run waits for the first
# instead of racing it.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Login credentials come from the account marked primary in the dashboard,
      # and `accounts` is admin-only under RLS — reading it needs the service
      # role key. Every run logs in, so every run fails without this secret.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ubuntu-latest ships with Google Chrome preinstalled here
      BROWSER_PATH: /usr/bin/google-chrome
      # run the real (non-headless) browser under a virtual display
      HEADLESS: "false"
      # Every run is a dispatch now, and every dispatch names its job.
      OP: ${{ inputs.op }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display (Xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run scraper (${{ env.OP }})
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node . --op=$OP ${{ inputs.guest && '--guest' || '' }}
