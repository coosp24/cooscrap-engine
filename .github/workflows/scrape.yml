name: Scrape stories

on:
  schedule:
    # Runs twice a day at 06:00 and 18:00 UTC. Adjust to your timezone.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EMAIL: ${{ secrets.COOMEET_EMAIL }}
      PASSWORD: ${{ secrets.COOMEET_PASSWORD }}
      # ubuntu-latest ships with Google Chrome preinstalled here
      BROWSER_PATH: /usr/bin/google-chrome
      # run the real (non-headless) browser under a virtual display
      HEADLESS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display (Xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run scraper
        run: xvfb-run --auto-servernum node .
