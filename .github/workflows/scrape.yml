name: Scrape

on:
  schedule:
    # Stories (videos): four times a day, every 6 hours (UTC).
    - cron: "0 0,6,12,18 * * *"
    # Images + names: once a day, offset so it never overlaps a story run.
    - cron: "0 3 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab
    inputs:
      op:
        description: Operation to run
        type: choice
        default: scrape-stories
        options:
          - scrape-stories
          - scrape-images

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      # ubuntu-latest ships with Google Chrome preinstalled here
      BROWSER_PATH: /usr/bin/google-chrome
      # run the real (non-headless) browser under a virtual display
      HEADLESS: "false"
      # github.event.schedule is the cron expression that fired, so the daily
      # 03:00 schedule runs the images+names scrape and every other schedule
      # (or a manual run without an explicit choice) scrapes stories.
      OP: ${{ github.event_name == 'workflow_dispatch' && inputs.op || (github.event.schedule == '0 3 * * *' && 'scrape-images' || 'scrape-stories') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display (Xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run scraper (${{ env.OP }})
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node . --op=$OP
