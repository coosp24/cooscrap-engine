name: Scrape stories

on:
  schedule:
    # Runs twice a day at 06:00 and 18:00 UTC. Adjust to your timezone.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      # ubuntu-latest ships with Google Chrome preinstalled here
      BROWSER_PATH: /usr/bin/google-chrome
      # run the real (non-headless) browser under a virtual display
      HEADLESS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display (Xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check secret/variable presence (diagnostic)
        env:
          S_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          S_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          S_EMAIL: ${{ secrets.EMAIL }}
          S_PASSWORD: ${{ secrets.PASSWORD }}
          V_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          V_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          chk() { if [ -n "$2" ]; then echo "$1: SET (len ${#2})"; else echo "$1: EMPTY"; fi; }
          echo "-- repository SECRETS --"
          chk "SUPABASE_URL"      "$S_SUPABASE_URL"
          chk "SUPABASE_ANON_KEY" "$S_SUPABASE_ANON_KEY"
          chk "EMAIL"             "$S_EMAIL"
          chk "PASSWORD"          "$S_PASSWORD"
          echo "-- repository VARIABLES (should be EMPTY; only set if you used the wrong tab) --"
          chk "SUPABASE_URL"      "$V_SUPABASE_URL"
          chk "SUPABASE_ANON_KEY" "$V_SUPABASE_ANON_KEY"

      - name: Run scraper
        run: xvfb-run --auto-servernum node .
